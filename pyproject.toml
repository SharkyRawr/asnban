[project]
name = "asnban"
version = "1.0.0"
description = "A python script to query and quickly ban whole prefixes for any given autonomous system."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests",
    "beautifulsoup4",
    "PyYAML",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
