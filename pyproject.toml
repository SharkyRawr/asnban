[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asnban"
version = "1.0.0"
description = "Query and quickly ban whole prefixes for any given autonomous system."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests",
    "beautifulsoup4",
    "PyYAML",
]

[project.scripts]
asnban = "asnban.cli:main"

[dependency-groups]
dev = [
    "black",
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=asnban --cov-report=term-missing"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
